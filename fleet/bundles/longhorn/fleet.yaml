# Per-path Fleet config for the Longhorn bundle - SINGLE MODE, ONE FILE.
#
# Everything lives HERE: chart source (repo+chart), THE version pin, the
# release name, and the values. There is no separate values file and no
# second mode - this `version:` line is the ONLY version-carrying field in
# the bundle, so it is the only thing you edit to upgrade Longhorn
# (validated 2026-09-28 on lab Fleet, Rancher 2.14.1, and in service since:
# the release is ADOPTED in place - releaseName + takeOwnership - revision
# bumps on the SAME release, no duplicate install, no pod churn).
#
# Upgrade = edit `version:` -> commit -> push, always as its OWN commit
# (cluster-template changes and Longhorn changes never share a commit), then
# run the verification round (scripts/baseline.sh before, verify.sh after).
#
# GOTCHA (Fleet on Rancher 2.14.x/2.15.x): unknown keys under `helm:` are
# SILENTLY DROPPED - the namespace must be the TOP-LEVEL defaultNamespace
# (plain STRING in this era). Longhorn must install into longhorn-system.
# If you ever need a key not in the current schema, check the
# bundledeployments.fleet.cattle.io CRD first - do not guess.
defaultNamespace: longhorn-system
helm:
  repo: https://charts.longhorn.io
  chart: longhorn
  version: "1.11.2"
  releaseName: longhorn
  takeOwnership: true
  values:
    persistence:
      defaultClass: true
      # Production-shaped default: 3 replicas across >= 3 workers - this is
      # what makes node drain / machine replacement survivable for all
      # volumes. Adjust counts to your topology (>= 3 replicas recommended).
      defaultClassReplicaCount: 3
    defaultSettings:
      # Match the storage class default so all volumes get the 3-replica
      # shape.
      defaultReplicaCount: "3"
      # Do not stack two replicas of the same volume on one node
      # (replicaSoftAntiAffinity): when distinct nodes are short, the volume
      # stays degraded - loud - instead of silently co-locating. Zone-level
      # spreading is a separate setting (replicaZoneSoftAntiAffinity) for
      # zonal clusters.
      replicaSoftAntiAffinity: "false"