# Managed from longhorn-capi-controller config/rbac/workload_role.yaml (do not edit here).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-capi-eviction-workload
  labels:
    app.kubernetes.io/name: longhorn-capi-controller
    app.kubernetes.io/component: workload-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-capi-eviction-workload
subjects:
  - kind: ServiceAccount
    name: lhcc-eviction-agent
    namespace: kube-system
# -----------------------------------------------------------------------------
# MANAGEMENT cluster side — hand the credential to the controller. Build a
# kubeconfig from the token above and store it as a dedicated Secret in the
# cluster's provisioning namespace (fleet-default for Rancher-provisioned
# clusters). Key must be "value"; the controller falls back to the shared
# <cluster>-kubeconfig Secret when this one is absent.
#
#   TOKEN=$(kubectl --kubeconfig <workload-admin-kubeconfig> -n kube-system \
#     get secret lhcc-eviction-agent-token -o jsonpath='{.data.token}' | base64 -d)
#   CA=$(kubectl --kubeconfig <workload-admin-kubeconfig> -n default \
#     get cm kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' | base64 -w0)
#   kubectl -n fleet-default create secret generic <cluster-id>-lhcc-kubeconfig \
#     --from-literal=value="$(cat <<KC
#   apiVersion: v1
#   kind: Config
#   clusters:
#   - name: cluster
#     cluster:
#       server: https://<workload-apiserver>:6443
#       certificate-authority-data: $CA
#   contexts:
#   - name: cluster
#     context: {cluster: cluster, user: lhcc-eviction-agent}
#   current-context: cluster
#   users:
#   - name: lhcc-eviction-agent
#     user: {token: $TOKEN}
#   KC
#   )"
#
# server must be reachable FROM THE CONTROLLER POD on the management cluster.
# A control-plane node IP works but changes when that VM is replaced — prefer
# a stable endpoint (LB/DNS) where available. The kubeconfig's internal entry
# names are irrelevant to the controller; "cluster" matches CAPI convention.
