# Gateway API bundle -> a DOWNSTREAM workload cluster (NOT the Harvester
# cluster — contrast with the harvester-lb GitRepo which targets the
# Harvester host cluster). Namespace rule: GitRepo lives where the
# target's clusters.fleet object lives (fleet-default for provisioned
# clusters).
#
# PREREQUISITE: extraChartValues in cluster-templates/chart/values.yaml
# must carry the rke2-traefik kubernetesGateway enable + gateway.enabled
# false (see gateway-traefik/README.md) BEFORE this bundle lands, or the
# Gateway sits Accepted=False with no controller.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: <REPLACE_ME_CLUSTER>-gateway-traefik
  namespace: fleet-default
spec:
  # PRIVATE REPO: uncomment and create the HTTP Basic Auth secret first —
  # see docs/git-credentials.md. The examples assume anon http clones of public
  # repos, so this is commented out here.
  # Secret must exist in the same namespace as the GitRepo CR
  # clientSecretName: <REPLACE_ME-git-auth>
  repo: "https://<REPLACE_ME_GIT_HOST>/<org>/<repo>.git"
  branch: <REPLACE_ME_BRANCH>
  paths:
  - gateway-traefik
  targets:
  # clusterName pins by the fleet Cluster object's NAME — human-readable,
  # and it survives a same-name rebuild (a c-m-... id label regenerates per
  # rebuild and strands the repo silently at 0/0; see longhorn.yaml and
  # docs/gitrepo-fleet-clustertemplate.md).
  - clusterName: <REPLACE_ME_CLUSTER>
