# Longhorn bundle GitRepo (fleet.cattle.io) - EXAMPLE
# Deploys Longhorn only onto clusters carrying the target label.
#
# WHERE THIS OBJECT LIVES - applied against the SAME Rancher management
# kubeconfig as the cluster-template GitRepo; nothing is ever
# kubectl-applied INTO a workload cluster. metadata.namespace selects the
# Fleet WORKSPACE = the candidate pool: fleet-default holds every
# Rancher-provisioned cluster (fleet-local would be the mgmt cluster
# itself). Rule of thumb: TEMPLATES -> fleet-local, COMPONENTS ->
# fleet-default.
#
# ROUTING needs BOTH halves:
#   1. spec.targets below (clusterSelector), AND
#   2. a MATCHING LABEL ON the target FLEET cluster object (not the
#      provisioning Cluster CR). Select the AUTO-POPULATED
#      management.cattle.io/cluster-name label - read the real values with:
#        kubectl get clusters.fleet.cattle.io -n fleet-default \
#          -L management.cattle.io/cluster-name
#      Miss the match and the bundle sits at "0/0 targets" with no
#      bundledeployment - nothing deploys and nothing errors.
#
#   WHICH OBJECT CARRIES THE LABELS - `clusters.fleet.cattle.io` in the
#   workspace namespace. Do NOT mistake lookalikes:
#     - `kubectl get clusters` resolves the SHORT NAME to cluster.x-k8s.io
#       (CAPI Cluster) - a different object, not the targeting surface.
#     - the provisioning Cluster CR (clusters.provisioning.cattle.io) only
#       carries Helm/objectset bookkeeping labels.
#   Labels fleet/populates on that object out of the box:
#     provider.cattle.io (rke2 | harvester | ...),
#     management.cattle.io/cluster-name (the c-m-... id),
#     management.cattle.io/cluster-display-name,
#     app.kubernetes.io/managed-by=Helm, objectset.rio.cattle.io/hash.
#   Hand-rolled labels (e.g. managed-by=fleet) exist ONLY where the
#   operator adds them - miss the labeling step and the selector silently
#   matches nothing (0/0). Prefer the auto-populated labels. Node/VM
#   labels play no part in Fleet targeting.
#
#   ONE REPO = ONE CLUSTER? A NAME target is the zero-knowledge pin:
#     targets:
#     - clusterName: <cluster-name>     # the fleet Cluster object's NAME
#   (for Rancher-provisioned clusters that IS the cluster name; imported
#   clusters get their id as the name). Human-readable in review, and it
#   survives a rebuild that keeps the cluster name. The id LABEL selector
#   below is equally valid but pins the generated c-m-... id: knowable
#   only after first build, and it REGENERATES on delete+recreate (the
#   name survives, the id does not) - update the selector after a
#   rebuild. Label selectors also scale to repos shared across many
#   clusters (env tiers etc.).
# Watch progress on the MGMT cluster: the bundledeployment appears in the
# target's envelope namespace (cluster-fleet-default-<cluster>-<hash>); the
# guest cluster only ever sees the RESULT (pods in longhorn-system).
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: "<REPLACE_ME>-longhorn"
  namespace: fleet-default
spec:
  # PRIVATE REPO: uncomment and create the HTTP Basic Auth secret first —
  # see docs/git-credentials.md. The examples assume anon http clones of public
  # repos, so this is commented out here.
  # Secret must exist in the same namespace as the GitRepo CR
  # clientSecretName: <REPLACE_ME-git-auth>
  branch: "<REPLACE_ME_BRANCH>"
  paths:
  - fleet/bundles/longhorn
  # OPTIONAL: also ship the guest identity for the longhorn-capi-controller
  # (inert without the controller). See UPGRADE.md, "The optional lhcc-rbac
  # bundle", before uncommenting.
  # - fleet/bundles/lhcc-rbac
  repo: "https://<REPLACE_ME_GIT_HOST>/<org>/<repo>.git"
  targets:
  # management.cattle.io/cluster-name is AUTO-POPULATED by Fleet on
  # every cluster object - read the real value with the kubectl
  # command in the ROUTING notes above.
  - clusterSelector:
      matchLabels:
        management.cattle.io/cluster-name: <c-m-clusterid>