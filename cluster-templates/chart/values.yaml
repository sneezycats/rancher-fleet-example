# Values for the RKE2-on-Harvester cluster template (EXAMPLE skeleton).
#
# Every <REPLACE_ME_*> must be set for a real environment. Example values that
# are NOT wrapped serve as sane defaults and can be kept as-is.

# Cluster name: defaults to the helm release name.
#   install as: helm install <REPLACE_ME_CLUSTER> ./cluster-templates/chart
name: ""
description: ""

# Kubernetes version — MUST be validated against the Rancher Support Matrix
# for YOUR Rancher version before deploying:
# https://www.suse.com/suse-rancher/support-matrix/
# Example: an older, well-supported pin is a good baseline for
# upgrade-ladder labs.
kubernetesVersion: "v1.33.13+rke2r1"

# Rancher cloud credential — from the Rancher UI's Cloud Credentials page,
# take the ID (the "cc-..." identifier), NOT the friendly name column.
# Prefix it with the namespace Rancher stores the secret in — this chart
# passes the value through verbatim, so include the namespace. cc-<id> is the
# Secret name (metadata.name) in cattle-global-data; the friendly UI name
# lives only in the secret's field.cattle.io/name annotation. Optional helper
# if scripting (label -> cc-<id>):
#   kubectl -n cattle-global-data get secrets -o json \
#     | python3 cluster-templates/scripts/cc-lookup.py <LABEL>
cloudCredentialSecretName: "cattle-global-data:cc-<id>"  # ID from the UI, with namespace

# --- Harvester provider defaults (per-pool overrides possible below) ---
vmNamespace: "<REPLACE_ME_VM_NAMESPACE>"        # e.g. k8s-vms
networkName: "<REPLACE_ME_NETWORK>"             # <ns>/<network>, must exist on Harvester
imageName: "<REPLACE_ME_IMAGE>"                 # VMImage displayName, must exist on Harvester
diskSize: 80                                    # GiB — root disk (example)
diskBus: "virtio"
sshUser: "<REPLACE_ME_SSH_USER>"                # user the node driver provisions
# cloud-init user_data — base64 of your user/ssh-key list. Example generation:
#   echo " #cloud-config
# users: [{name: ops, sudo: 'ALL=(ALL) NOPASSWD:ALL', ssh_authorized_keys: ['<KEY>']}]" \
#     | base64 -w0
# IMPORTANT: do not commit real keys — reference a secret-managed file or CI var.
userData: "<REPLACE_ME_BASE64_CLOUDINIT>"

# --- RKE2 global config (example: calico + traefik, clickops-parity shape) ---
# `ingress-controller` is the same knob the Rancher cluster UI's Ingress
# section manages. Accepted values (RKE2 `--ingress-controller`):
#   traefik                  - Traefik only (the UI's "Traefik" card; default
#                              for new clusters in RKE2 v1.36+)
#   ingress-nginx            - Ingress-NGINX only (the UI's "Ingress NGINX"
#                              card; legacy - upstream ingress-nginx is EOL
#                              as of 2026-03)
#   none                     - no bundled ingress controller
#   [traefik, ingress-nginx] - DUAL mode: both controllers side by side (the
#                              UI's "Dual Mode" card) - lets Ingress-NGINX
#                              workloads move to Traefik one by one.
#                              Requires a 2026-06+ RKE2 release (v1.32.11 /
#                              v1.33.7 lines and up).
# One controller = string; two = LIST. The FIRST entry becomes the cluster's
# default IngressClass (during a migration keep the incumbent first; flip the
# order when you cut over). Both controllers default to host ports 80/443, so
# a dual deployment MUST move one of them - see `extraChartValues` below for
# the exact Traefik values the UI writes for Dual Mode.
machineGlobalConfig:
  cni: calico
  ingress-controller: traefik

# Harvester cloud-provider chart values (CCM installed on control-plane nodes)
harvesterCloudProvider:
  cloudConfigPath: /var/lib/rancher/rke2/etc/config-files/cloud-provider-config

# --- Extra chartValues (pass-through into spec.rkeConfig.chartValues) ---
# Merged verbatim into the Cluster CR's `spec.rkeConfig.chartValues` - the
# same slot Rancher fills for the RKE2 packaged charts (rke2-coredns,
# rke2-ingress-nginx, rke2-traefik, ...) and for the Harvester CCM above.
# What the UI writes, this pass-through can carry.
#
# DUAL-INGRESS RECIPE (only valid with the two-controller list above): the
# exact values the Rancher UI writes for its "Dual Mode" option.
# Ingress-NGINX keeps 80/443; Traefik moves to 8000/8443 and gains its
# Ingress-NGINX compatibility provider, which serves any Ingress that opts
# in via the migration class
# (`ingressClassName: rke2-ingress-nginx-migration`) - that class is the
# per-workload switch out of NGINX. Chart-key gate: the provider key was
# renamed kubernetesIngressNginx -> kubernetesIngressNGINX in the 2026-06
# chart line (present in the rke2-traefik chart shipped with v1.33.13); on
# older RKE2 the lowercase key is the active one, and a wrong-case key
# silently leaves the provider disabled.
#
# extraChartValues:
#   rke2-traefik:
#     ports:
#       web:
#         hostPort: 8000
#       websecure:
#         hostPort: 8443
#     providers:
#       kubernetesIngressNGINX:
#         enabled: true
#         ingressClass: rke2-ingress-nginx-migration
#         controllerClass: rke2.cattle.io/ingress-nginx-migration
extraChartValues: {}

# --- Node pools (example: 3 CP @ 6 vCPU/6 GiB + 3 workers @ 6 vCPU/4 GiB) ---
nodepools:
  - name: control-plane
    etcd: true
    controlplane: true
    worker: false
    quantity: 3
    vcpu: 6
    memory: 6
    disk: 80
    # control-plane pools are NOT drained — Rancher default/convention.
  - name: workers
    etcd: false
    controlplane: false
    worker: true
    quantity: 3
    vcpu: 6
    memory: 4
    disk: 160
    # Drain the node BEFORE deleting its VM. Without this the Fleet path
    # deletes the VM in parallel with the deletion signal (hook-blind):
    # Longhorn gets no window and the eviction controller relocation races a
    # 21-46s teardown. drainBeforeDeleteTimeout bounds a wedged drain
    # (empty/0 = infinite); 1h is generous vs the ~30-60s relocation window.
    drainBeforeDelete: true
    # Duration in canonical Go form (1h0m0s, not 3600s): Rancher normalizes
    # duration strings through time.Duration and rewrites them, so a
    # non-canonical chart value reads as a change to a field the rancher
    # manager owns - an SSA conflict that blocks the whole bundle. The
    # fleet.yaml beside this chart sets helm.takeOwnership: true so Fleet
    # force-applies the Cluster spec.
    drainBeforeDeleteTimeout: 1h0m0s
