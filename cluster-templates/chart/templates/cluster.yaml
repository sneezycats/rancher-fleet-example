apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name | default .Release.Name }}
  namespace: fleet-default
  {{- with .Values.description }}
  annotations:
    field.cattle.io/description: {{ . | quote }}
  {{- end }}
spec:
  cloudCredentialSecretName: {{ .Values.cloudCredentialSecretName | quote }}
  enableNetworkPolicy: false
  kubernetesVersion: {{ .Values.kubernetesVersion | quote }}
  rkeConfig:
    chartValues:
      global:
        cattle:
          clusterName: {{ .Values.name | default .Release.Name | quote }}
      harvester-cloud-provider:
        cloudConfigPath: {{ .Values.harvesterCloudProvider.cloudConfigPath | quote }}
      {{- with .Values.extraChartValues }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    machineGlobalConfig:
      {{- toYaml .Values.machineGlobalConfig | nindent 6 }}
    machinePools:
      {{- range $i, $pool := .Values.nodepools }}
      - name: {{ $pool.name }}
        displayName: {{ $pool.name }}
        {{- /* Emit booleans ONLY when true: Rancher's provisioning normalizer
             strips false-valued machinePools booleans, so an always-rendered
             `false` makes Fleet count the Cluster as Modified forever. Omitted
             == false for these fields (validated live on 2.14.3). */}}
        {{- if $pool.controlplane }}
        controlPlaneRole: true
        {{- end }}
        {{- if $pool.etcd }}
        etcdRole: true
        {{- end }}
        {{- if $pool.worker }}
        workerRole: true
        {{- end }}
        quantity: {{ $pool.quantity | default 1 }}
        {{- if $pool.drainBeforeDelete }}
        drainBeforeDelete: true
        {{- end }}
        {{- with $pool.drainBeforeDeleteTimeout }}
        drainBeforeDeleteTimeout: {{ . | quote }}
        {{- end }}
        machineOS: linux
        machineConfigRef:
          kind: HarvesterConfig
          name: {{ $.Release.Name }}-{{ $pool.name }}
      {{- end }}
    {{- with .Values.upgradeStrategy }}
    upgradeStrategy:
      {{- /* Ordering policy for Kubernetes VERSION upgrades only. It does not
             govern image hops: an image hop changes the pool's machine config,
             Rancher re-clones that pool's template, and CAPI rolls that pool by
             its MachineDeployment strategy - upgradeStrategy never enters that
             path (measured on 2.14.3: defining the block moved zero machines).
             Rendered only when values supply it; omitted == Rancher's own
             defaults. Drain options are deliberately NOT defaulted here:
             Rancher's normalizer strips false-valued booleans elsewhere in this
             CR (see the machinePools note above) and an always-rendered
             `enabled: false` risks permanent Modified churn. Omitted means
             false, so add the block only when you actually want draining. */}}
      {{- toYaml . | nindent 6 }}
    {{- end }}
