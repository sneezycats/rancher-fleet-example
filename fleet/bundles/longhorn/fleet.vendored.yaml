# VENDORED MODE Longhorn bundle config - ALTERNATIVE to fleet.yaml
#
# How to activate: (1) `cp fleet.vendored.yaml fleet.yaml`, (2) ensure
# longhorn-chart/ holds the desired chart (see below). This mode commits the
# chart itself - byte-for-byte deployable artifact, no external repo needed
# at deploy time. Air-gap friendly, but every upgrade requires a client step:
#
#   helm repo add longhorn https://charts.longhorn.io   # once per client
#   helm pull longhorn/longhorn --version X.Y.Z --untar --untardir . \
#     && rm -rf longhorn-chart && mv longhorn longhorn-chart
#   git add longhorn-chart && git commit && git push
#
# This directory SHOWS THE END STATE (longhorn-chart/ committed at 1.11.2):
# the pull + replace + commit must be REPEATED for EVERY Longhorn version
# upgrade - the vendored chart IS the version pin. Config-only changes to
# longhorn-values.yaml need no re-pull. Check the Longhorn-K8s support matrix
# for every target cluster's Kubernetes minor first.
#
# GOTCHA (Fleet on Rancher 2.14.1 / 2.15.1): unknown keys under `helm:` are
# SILENTLY DROPPED - namespace must be the TOP-LEVEL defaultNamespace (plain
# STRING in this era).
defaultNamespace: longhorn-system
helm:
  chart: ./longhorn-chart
  releaseName: longhorn
  takeOwnership: true
  valuesFiles:
    - longhorn-values.yaml
