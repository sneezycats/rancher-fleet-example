---
# Source: rke2-harvester-example/templates/cluster.yaml
apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: render-check
  namespace: fleet-default
spec:
  cloudCredentialSecretName: "cattle-global-data:cc-example"
  enableNetworkPolicy: false
  kubernetesVersion: "v1.33.13+rke2r1"
  rkeConfig:
    chartValues:
      global:
        cattle:
          clusterName: "render-check"
      harvester-cloud-provider:
        cloudConfigPath: "/var/lib/rancher/rke2/etc/config-files/cloud-provider-config"
      rke2-traefik:
        gateway:
          enabled: false
        providers:
          kubernetesGateway:
            enabled: true
    machineGlobalConfig:
      cni: cilium
      ingress-controller: traefik
    machinePools:
      - name: control-plane
        displayName: control-plane
        controlPlaneRole: true
        etcdRole: true
        quantity: 3
        machineOS: linux
        machineConfigRef:
          kind: HarvesterConfig
          name: render-check-control-plane
      - name: workers
        displayName: workers
        workerRole: true
        quantity: 3
        drainBeforeDelete: true
        drainBeforeDeleteTimeout: "1h0m0s"
        machineOS: linux
        machineConfigRef:
          kind: HarvesterConfig
          name: render-check-workers

