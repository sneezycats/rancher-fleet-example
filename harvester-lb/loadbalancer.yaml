# One L4 LB per PORT GROUP per workload cluster. Each LB consumes one
# pool IP. healthCheck.port gates the WHOLE backend set of an LB, not
# per-listener — so if you DO run an apiserver LB alongside the ingress
# LB, they must stay split (one LB with 6443 AND 80 listeners cannot
# health-check both: whichever port you probe excludes the nodes not
# serving it). See README.md pitfall 10.
#
# Reference chain: upstream L7 balancer (e.g. F5) -> pool member = the
# ingress LB VIP below.
# backendServerSelector matches the labels the Harvester node driver
# STAMPS AUTOMATICALLY — no manual labeling step. Useful ones:
#   guestcluster.harvesterhci.io/name = <clusterName>        (whole cluster)
#   harvesterhci.io/machineSetName    = <vmNamespace>-<clusterName>-<poolName>
#                                          (one pool; deterministic — poolName
#                                           is the machinePools[].name from the
#                                           Cluster CR)
#   nodepool.harvesterhci.io/name     = <poolName>-<5-char suffix> (AVOID for
#                                       GitOps: the suffix is generated per
#                                       machine deployment)
# The IPPool has its own separate scope selector (ippool.yaml) — different
# object, different job.
#
# Ingress/gateway LB — the single pool member an upstream L7 balancer
# (e.g. F5) points at. RKE2's bundled Traefik (like ingress-nginx before
# it) is a WORKERS-only DaemonSet: CP nodes carry NoSchedule taints and
# the chart adds no tolerations, so hostPort 80/443 exist only on worker
# IPs. Select the worker pool: CPs in the backend set would sit in it
# failing health checks. The cluster's ingress owns L7 routing; the LB
# is port-agnostic TCP below the VIP.
apiVersion: loadbalancer.harvesterhci.io/v1beta1
kind: LoadBalancer
metadata:
  name: <REPLACE_ME_CLUSTER>-ingress
  namespace: <REPLACE_ME_VM_NAMESPACE>   # MUST equal the VM namespace
spec:
  ipam: pool
  ipPool: <REPLACE_ME_POOL>
  workloadType: vm                       # pitfall 8
  listeners:
    - name: http
      port: 80
      protocol: TCP
      backendPort: 80
    - name: https
      port: 443
      protocol: TCP
      backendPort: 443
  backendServerSelector:
    # Worker pool only: machineSetName encodes namespace+cluster+pool in
    # one deterministic label (poolName = machinePools[].name from the
    # Cluster CR). CPs are excluded — bundled Traefik doesn't run there.
    harvesterhci.io/machineSetName:
      - <REPLACE_ME_VM_NAMESPACE>-<REPLACE_ME_CLUSTER>-<REPLACE_ME_WORKER_POOL>
      # e.g. prod-ns-mycluster-workers
  healthCheck:
    port: 80                             # gates the whole set — keep it an ingress port
    successThreshold: 1
    failureThreshold: 3
    periodSeconds: 5                     # lowercase p (pitfall 7)
    timeoutSeconds: 3
---
# OPTIONAL apiserver LB — commented out by default. Under the default
# Rancher posture you do NOT need it: Rancher proxies kubectl to every
# downstream cluster (https://<rancher>/k8s/clusters/<id>), node agents
# dial out to the Rancher URL, and nothing external dials the guest
# API server directly. Enable it when you want one of:
#   - break-glass kubectl that survives a Rancher outage (the proxy path
#     dies with Rancher; a direct VIP does not),
#   - external automation holding its own kubeconfig against a stable
#     VIP that survives control-plane replacement,
#   - an upstream L7 balancer fronting 6443 as well as 80/443.
# If enabled, add the VIP to the API server's serving cert SANs (RKE2
# `api-endpoints`) or direct clients hit TLS name mismatches.
# apiVersion: loadbalancer.harvesterhci.io/v1beta1
# kind: LoadBalancer
# metadata:
#   name: <REPLACE_ME_CLUSTER>-apiserver
#   namespace: <REPLACE_ME_VM_NAMESPACE>
# spec:
#   ipam: pool
#   ipPool: <REPLACE_ME_POOL>
#   workloadType: vm
#   listeners:
#     - name: apiserver
#       port: 6443
#       protocol: TCP
#       backendPort: 6443
#   backendServerSelector:
#     # CP pool only — 6443 is served there.
#     harvesterhci.io/machineSetName:
#       - <REPLACE_ME_VM_NAMESPACE>-<REPLACE_ME_CLUSTER>-<REPLACE_ME_CP_POOL>
#       # e.g. prod-ns-mycluster-control-plane
#   healthCheck:
#     port: 6443                         # must equal a listener backendPort
#     successThreshold: 1
#     failureThreshold: 3
#     periodSeconds: 5
#     timeoutSeconds: 3
