apiVersion: v1
name: lhcc-rbac
version: 0.11.0
appVersion: 0.11.0
description: >-
  Longhorn CAPI controller guest-cluster identity bundle (least privilege).
  Deploys the lhcc-eviction-agent ServiceAccount, its never-expiring token
  Secret, the workload ClusterRole, and the binding inside each protected
  cluster. Pair with the management-side dedicated kubeconfig Secret (see
  the longhorn-capi-controller lhcc-setup-workload-identity.sh).
home: https://github.com/sneezycats/longhorn-capi-controller
kubeVersion: ">=1.24.0-0"
