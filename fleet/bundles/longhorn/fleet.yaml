# Per-path Fleet config — pins the Longhorn chart. The chart is VENDORED
# (longhorn-chart/ at this path) so the deploy path has no external repo
# dependency. Upgrades:#
# *** NOTE: this repository SHOWS THE END STATE — the vendored chart is
# committed at longhorn-chart/ (currently 1.11.2) and this is exactly what
# Fleet deploys. The helm pull + replace + commit must be REPEATED for EVERY
# Longhorn version upgrade: the vendored chart IS the version pin. There is no
# remote-chart fetch at deploy time. Config-only changes (longhorn-values.yaml)
# need no re-pull.
 `helm pull longhorn/longhorn --version X.Y.Z --untar
# --untardir . && mv longhorn longhorn-chart` — after checking the
# Longhorn↔K8s support matrix for every target cluster's Kubernetes minor.
#
# GOTCHA (Fleet version on Rancher 2.15.1): unknown keys under `helm:` are
# SILENTLY DROPPED — `helm.targetNamespace`/`helm.createNamespace` did
# nothing and the release landed in `default`. The namespace is set with the
# TOP-LEVEL key instead (verified via bundle spec.options). NOTE: in THIS
# Fleet version defaultNamespace is a plain STRING (newer Fleets take an
# object). The Longhorn chart must install into longhorn-system only.
defaultNamespace: longhorn-system
helm:
  chart: ./longhorn-chart
  releaseName: longhorn
  valuesFiles:
    - longhorn-values.yaml
